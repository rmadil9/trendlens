# Security headers, factored into a snippet so they can be re-included per
# location.
#
# This exists because of a specific nginx rule that is easy to get wrong:
# add_header directives are inherited from an enclosing block ONLY IF the inner
# block declares no add_header of its own. One add_header anywhere in a
# location silently drops every inherited one — no warning, no error, and
# `nginx -t` passes.
#
# Concretely: `location /` sets a Cache-Control header, which discarded all
# four of these for the HTML page while `/api/` (which sets none) kept them.
# The result was security headers present on the JSON API and absent on the
# document — the exact inverse of what matters for clickjacking and HSTS.
#
# Including this file in every block that sets any header keeps them attached.

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
